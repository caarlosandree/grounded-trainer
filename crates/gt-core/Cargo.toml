[package]
name = "gt-core"
description = "Núcleo genérico: processos, memória, PE, busca AOB, assembly e patches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Escrita crua em /proc/<pid>/mem. O `gt` nunca ativa esta feature.
write = ["dep:libc"]
# Apoio a testes (mmap/prctl) para o processo-alvo de teste.
test-support = ["dep:libc"]

[dependencies]
goblin.workspace = true
iced-x86.workspace = true
libc = { workspace = true, optional = true }
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
