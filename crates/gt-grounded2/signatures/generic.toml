# Ação: soma 1 hora ao relógio do jogo (spec 008, 6.8.2). `CurrentTime` é um `double` do `CalendarComponent`, que
# mora no `SurvivalGameState` (subclasse do `InGameGameState`): `owner_class` diz a classe dona do primeiro salto
# e o trainer confere que o `GameState` vivo é dela antes de ler o campo. O jogo soma ao relógio a cada quadro,
# então a releitura nunca é exata: `at_least` aceita "maior ou igual". Uma grade de um ponto só (sem ←→); o `label`
# é o texto da quantidade na linha. Sem diário e sem desfazer (a hora vai para o save).
[[field]]
id = "pular-hora"
name = "Pular 1 hora"
category = "progressao"
description = "Avança o relógio do jogo em 1 hora; vai para o save e não tem desfazer"
object = "CalendarComponent"
object_class = "/Script/Maine.CalendarComponent"
root = "game_state"
owner_class = "/Script/Maine.SurvivalGameState"
rule = "add"
field = "CurrentTime"
kind = "double"
at_least = true
result_max = 1000000000

[field.value]
type = "f64"
points = [3600.0]
default = 3600.0
label = "+1h"

# Congelar a hora do dia (spec 008, 6.8.1): `set` do `GameToRealTimeRatio` para 0, sem valor ajustável; o original
# volta ao desligar. O campo mora no `CalendarComponent` do `SurvivalGameState` (mesma classe dona do `pular-hora`).
# `min`/`max` só validam o `target` na carga. Risco: dormir com a hora congelada (spec 6.8.1).
[[field]]
id = "congelar-hora"
name = "Congelar hora do dia"
category = "progressao"
description = "Para o relógio do jogo; a razão original do tempo volta ao desligar"
object = "CalendarComponent"
object_class = "/Script/Maine.CalendarComponent"
root = "game_state"
owner_class = "/Script/Maine.SurvivalGameState"
rule = "set"
fields = ["GameToRealTimeRatio"]
kind = "float"
target = 0.0
min = 0.0
max = 1000.0

# Fase 6 (spec 008): desvios com cave. Cada [[hook]] troca UMA instrução de 5+ bytes, decodificada na
# ocorrência do padrão em `offset` (sem `expected`: o padrão único já fixa os bytes que importam e o motor
# relê a instrução na pausa). `body` nomeia o corpo da cave, escrito em Rust. O valor (`[hook.value]`) é uma
# lista de pontos. Pontos achados por nós em 2026-10-27 (RESEARCH.md, "Sessão de 2026-10-27 (Fase 6)").

# Brain Power rápido (spec 6.6.1). Padrão estendido de `mov esi,[rcx+R]` (ResearchPoints antigo) até
# `cmp eax,[rbx+R]`, para conferir os registradores que a cave usa e o deslocamento de ResearchPoints (os três
# acessos têm de ser iguais, e iguais ao da reflexão). O desvio é `mov r14,[rax+T0]` (7 bytes, offset 36): ali
# `rax` é o objeto da tabela de níveis, com o início em T0, a contagem em T1 e o limite de cada nível em L.
[[hook]]
id = "brain-power"
name = "Brain Power rápido"
category = "progressao"
description = "Multiplica a ciência de Brain Power ganha, sem pular nível"
pattern = "8b b1 ?? ?? 00 00 4d 89 73 ?? 89 75 ?? 8d 04 16 48 8b 51 ?? 89 81 ?? ?? 00 00 e8 ?? ?? ?? ?? e8 ?? ?? ?? ?? 4c 8b b0 ?? ?? 00 00 48 63 80 ?? ?? 00 00 48 8d 0c 40 48 c1 e1 04 49 03 ce 4c 3b f1 0f 84 ?? ?? ?? ?? 0f 1f 80 00 00 00 00 41 8b 46 ?? 3b f0 7d ?? 3b 83 ?? ?? 00 00"
offset = 36
body = "brain"

[hook.value]
type = "i32"
points = [2, 3, 5, 10]
default = 2
unit = "x"

# Analisador infinito (spec 6.7.1): `movss xmm1,[rcx+charges]`, primeira instrução do getter das cargas. O
# deslocamento das cargas é o disp32 da própria instrução (curinga do padrão).
[[hook]]
id = "analisador-infinito"
name = "Analisador infinito"
category = "itens"
description = "O analisador de recursos não gasta cargas"
pattern = "f3 0f 10 89 ?? ?? 00 00 f3 0f 58 ?? f3 0f 5c ?? ?? ?? ?? ?? f3 0f 2d ?? d1 f8 c3"
offset = 0
body = "analyzer"
object_class = "/Script/Maine.ResourceAnalyzerBuilding"
