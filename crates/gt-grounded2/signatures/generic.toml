# Definições genéricas dos patches, válidas para qualquer versão do jogo (spec 002, 6.3).
#
# Cada patch é um bloco [[patch]] com:
#   id, name (nome curto em pt-BR), category (sobrevivencia, itens, progressao, movimento ou
#   diagnostico), description (pt-BR), module (opcional; padrão: o exe do jogo),
#   pattern (AOB com os bytes ORIGINAIS), offset, expected e replacement (bytes em hex).
# Opcional: bloco [patch.value] (type, slot, min, max, step, default, unit, decimals) que faz do
# patch um cheat com valor ajustável (spec 003, 6.3).
#
# Fase 5 (spec 005): o bloco [ue] traz o layout das estruturas de reflexão do motor, os padrões das duas
# globais e o caminho até o personagem. Os cheats de valor ficam em blocos [[field]] (6.5), com os campos
# citados por NOME da reflexão; nenhum offset de campo do jogo mora aqui.
#

# Patch de teste da Fase 2 (spec 002, 6.9): troca sem efeito na partida. `or rax, rdx` (48 0B C2) vira a
# outra codificação da mesma instrução (48 09 D0), dentro de uma espera ativa que as threads do jogo
# executam o tempo todo. Achado em 2026-10-25 (RESEARCH.md, sessão B).
[[patch]]
id = "teste-codificacao"
name = "Patch de teste"
category = "diagnostico"
description = "Troca sem efeito (codificação equivalente de or rax, rdx), para testar o motor"
pattern = "f3 90 0f 31 48 c1 e2 20 48 0b c2 48 2b c7 48 3b c3 72 ed"
offset = 8
expected = "48 0b c2"
replacement = "48 09 d0"

# Fase 4 (spec 004): patches simples de itens. Pontos achados por nós em 2026-10-26 (RESEARCH.md, catálogo do
# FLiNG); as trocas são instruções neutras do mesmo tamanho, sem bytes de terceiros.

# Desgaste de item: `movss xmm1,[rbx+0x298]` (Item.DurabilityRemaining), `subss xmm2,xmm8` tira o desgaste e o
# resultado é limitado entre 0 e o máximo. Sem a subtração o valor não muda e o `je` do jogo pula a gravação.
[[patch]]
id = "durabilidade-infinita"
name = "Durabilidade infinita"
category = "itens"
description = "Ferramentas, armas e armaduras não perdem durabilidade (o reparo pode não funcionar enquanto ligado)"
pattern = "f3 0f 10 8b 98 02 00 00 0f 28 d1 f3 41 0f 5c d0 f3 0f 5d d0 f3 0f 5f d6 0f 2e d1 74"
offset = 11
expected = "f3 41 0f 5c d0"
replacement = "0f 1f 44 00 00"

# Consumo de energia: `movss xmm0,[rcx+0x250]` (Item.PowerUsed), `addss xmm1,xmm3` soma o gasto e o resultado é
# limitado ao total do item. Sem a soma a energia gasta não aumenta e o `je` do jogo pula a gravação.
[[patch]]
id = "energia-infinita"
name = "Tocha infinita"
category = "itens"
description = "A tocha e os outros itens com energia não gastam energia"
pattern = "f3 0f 10 81 50 02 00 00 0f 28 c8 f3 0f 58 cb f3 0f 5d ca 0f 2e c8 74"
offset = 11
expected = "f3 0f 58 cb"
replacement = "0f 1f 40 00"

# Recarga de uso de item, no Tick do SurvivalPlayerController: `movaps xmm0,xmm7` copia a recarga restante
# (ItemUseCooldownRemaining, +0xb90) antes de tirar o tempo do quadro. Com `xorps xmm0,xmm0` o valor gravado fica
# negativo e o jogo encerra a recarga pelo próprio caminho. O curinga é o deslocamento do `jbe`.
[[patch]]
id = "recarga-instantanea"
name = "Recarga instantânea"
category = "itens"
description = "Sem espera entre um uso de item e o próximo"
pattern = "f3 0f 10 bb 90 0b 00 00 0f 57 c9 0f 2f f9 76 ?? 0f 28 c7 f3 0f 5c c6 0f 2f c1 f3 0f 11 83 90 0b 00 00"
offset = 16
expected = "0f 28 c7"
replacement = "0f 57 c0"

# Fase 5 (spec 005, 6.2): reflexão do motor. Nenhum valor é assumido no código; tudo vem daqui, e o
# <chave>.toml de uma build pode trocar o [ue.layout] inteiro.
#
# Globais por padrão com disp32 RIP-relativo (endereço = fim da instrução + disp32 + adjust). Padrões e
# conferência das ocorrências em docs/RESEARCH.md, sessão "Fase 5: globais do Unreal por padrão".
# - gobjects: `mov rax,[rip+X]; mov rcx,[rax+rcx*8]; lea rax,[rcx+rdx*8]`; 281 ocorrências, todas para a
#   mesma global. O disp32 fica em +3 e a instrução termina em +7.
# - names: inicialização preguiçosa do FNamePool (`je +9; lea reg,[pool]; jmp; lea rcx,[pool]; call`); 19
#   ocorrências, todas para o início da estrutura. Os blocos ficam em +0x10 dela, daí o `adjust` de 0x10.
[ue]
gobjects = { pattern = "48 8b 05 ?? ?? ?? ?? 48 8b 0c c8 48 8d 04 d1", disp_offset = 3, insn_end = 7, adjust = 0 }
names = { pattern = "74 09 ?? 8d ?? ?? ?? ?? ?? eb ?? 48 8d 0d ?? ?? ?? ?? e8", disp_offset = 14, insn_end = 18, adjust = 0x10 }

# GUObjectArray e a tabela de itens.
[ue.layout.objects]
chunks = 0x0
max_elements = 0x10
num_elements = 0x14
max_chunks = 0x18
num_chunks = 0x1c
items_per_chunk = 65536
item_size = 24
item_object = 0x8

# Cabeçalho de UObject (cdo_flag: bit de ObjectFlags que marca o CDO).
[ue.layout.uobject]
flags = 0x8
index = 0xc
class = 0x10
name = 0x18
outer = 0x20
cdo_flag = 0x10

[ue.layout.ustruct]
super_struct = 0x40
child_properties = 0x50
properties_size = 0x58

# class_name é o offset do nome do tipo dentro da FFieldClass.
[ue.layout.ffield]
class_private = 0x8
class_name = 0x0
next = 0x18
name = 0x20

[ue.layout.fprop]
element_size = 0x34
offset = 0x44

[ue.layout.fbool]
field_size = 0x70
byte_offset = 0x71
byte_mask = 0x72
field_mask = 0x73

# Ponteiro da UScriptStruct numa FStructProperty: os alvos `Struct.Campo` (ex.: HungerSettings.MaxValue).
[ue.layout.fstruct]
struct_ptr = 0x70

# Caminho até o personagem (spec 005, 6.3): o controller aponta para o pawn por um campo da reflexão.
[ue.player]
controller_class = "/Script/Maine.SurvivalPlayerController"
pawn_field = "Pawn"
pawn_class = "/Script/Maine.SurvivalPlayerCharacter"
# Montado, Pawn/Character/AcknowledgedPawn apontam para a montaria; este campo continua no personagem (P7,
# RESEARCH.md 2026-10-26, Fase 5).
alt_pawn_fields = ["CachedSurvivalPlayerCharacter"]
# Caminho até o GameState (spec 006, 6.3): controller -> Outer (Level) -> OwningWorld -> GameState. O Outer é
# o cabeçalho do UObject (layout), não um campo da reflexão. Os cinco campos vêm juntos.
level_class = "/Script/Engine.Level"
world_field = "OwningWorld"
world_class = "/Script/Engine.World"
game_state_field = "GameState"
game_state_class = "/Script/Maine.InGameGameState"
# ResearchPoints (spec 008, 6.10): o `PartyComponent` fica no GameState; o `gt ue player` mostra o campo e o
# Brain Power confere o offset dele contra os `disp` do padrão. Os três vêm juntos e exigem o game_state.
party_field = "PartyComponent"
party_class = "/Script/Maine.PartyComponent"
research_points_field = "ResearchPoints"
# Inventário do jogador (spec 008, 6.7.4): campo do pawn que aponta para o `InventoryComponent`; a coleta o mantém numa variável.
inventory_field = "InventoryComponent"

# Fase 5 (spec 005, 6.5): cheats de valor, na ordem da spec. Campos e alvos por NOME da reflexão (P2–P8 em
