[package]
name = "gt-grounded2"
description = "Conhecimento específico do Grounded 2: cheats e assinaturas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gt-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Habilita o motor de escrita do `gt-core` (ainda sem código próprio aqui).
write = ["gt-core/write"]

[dev-dependencies]
# O portão da pausa (testes ignorados) precisa de `pause`; fica só nos testes para o `gt-cli` não ganhar `write`.
gt-core = { workspace = true, features = ["write"] }
tempfile.workspace = true

[lints]
workspace = true
