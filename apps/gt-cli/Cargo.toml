[package]
name = "gt-cli"
description = "Ferramentas de pesquisa: inspect, read, scan, disasm, diff, dump, fling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "gt"

[[bin]]
name = "gt"
path = "src/main.rs"

[[bin]]
name = "gt-testtarget"
path = "src/bin/gt-testtarget.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
gt-core = { workspace = true, features = ["test-support"] }
gt-grounded2.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
gt-core = { workspace = true, features = ["write", "test-support"] }
tempfile.workspace = true

[lints]
workspace = true
