[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Versões fixadas na Fase 0 (estável mais recente em 2026-10-24).
# Cada crate declara só o que usa, com `dep.workspace = true`.
[workspace.dependencies]
gt-core = { path = "crates/gt-core" }
gt-ue = { path = "crates/gt-ue" }
gt-grounded2 = { path = "crates/gt-grounded2" }
gt-testkit = { path = "crates/gt-testkit" }

iced-x86 = "1.21.0"
goblin = "0.10.7"
nix = { version = "0.31.3", features = ["uio", "process", "fs", "feature", "signal", "poll"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
signal-hook = "0.4.5"
serde_json = "1.0.154"
libc = "0.2.191"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
